  <g transform="translate(118 500)">
    <ellipse cx="120" cy="318" rx="108" ry="12" fill="#e6dccb"/>
    <path d="M78 36 C86 8 108 4 120 4 C132 4 154 8 162 36" fill="none" stroke="#22301f" stroke-width="8" stroke-linecap="round"/>
