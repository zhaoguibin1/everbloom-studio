    <use href="#blossom" transform="translate(0 -40) scale(0.85)"/>
  </g>

  <!-- Day dress -->
  <g transform="translate(118 78)">
    <ellipse cx="120" cy="318" rx="108" ry="12" fill="#e6dccb"/>
    <ellipse cx="42" cy="92" rx="30" ry="18" fill="#fffdf8" stroke="#22301f" stroke-width="2.4"/>
    <ellipse cx="198" cy="92" rx="30" ry="18" fill="#fffdf8" stroke="#22301f" stroke-width="2.4"/>
    <path d="M36 148 H204 L236 312 Q120 330 4 312 Z" fill="#fffdf8" stroke="#22301f" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M52 78 C52 42 82 28 120 28 C158 28 188 42 188 78 L200 154 H40 Z" fill="#fffdf8" stroke="#22301f" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M86 62 Q120 88 154 62" fill="none" stroke="#22301f" stroke-width="1.7"/>
    <path d="M48 150 Q120 164 192 150" fill="none" stroke="#22301f" stroke-width="1.6"/>
