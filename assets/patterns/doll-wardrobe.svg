<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920">
  <title>Flat sketches of a floral day dress, blouse, pinafore, and bloomers</title>
  <rect width="1000" height="920" fill="#f7f3ec"/>
  <rect x="36" y="36" width="928" height="848" fill="none" stroke="#ddd3bf" stroke-width="1.5"/>

  <defs>
    <g id="blossom">
      <circle cx="0" cy="-6" r="3.1" fill="#a05c2c"/>
      <circle cx="5.6" cy="-1.8" r="3.1" fill="#a05c2c"/>
      <circle cx="3.4" cy="4.8" r="3.1" fill="#a05c2c"/>
      <circle cx="-3.4" cy="4.8" r="3.1" fill="#a05c2c"/>
      <circle cx="-5.6" cy="-1.8" r="3.1" fill="#a05c2c"/>
      <circle r="2.2" fill="#b98a2f"/>
    </g>
    <g id="leaf">
