    <path d="M86 48 H154 L166 152 H74 Z" fill="#e5f0e4" stroke="#22301f" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M40 150 H200" fill="none" stroke="#22301f" stroke-width="2"/>
    <path d="M120 78 C108 98 108 112 120 124 C132 112 132 98 120 78Z" fill="none" stroke="#33513a" stroke-width="2"/>
    <path d="M120 86 V116" fill="none" stroke="#33513a" stroke-width="1.4"/>
    <path d="M108 208 H156 V250 H108 Z" fill="#fffdf8" stroke="#22301f" stroke-width="1.8"/>
