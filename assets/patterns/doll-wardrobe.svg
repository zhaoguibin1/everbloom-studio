  <g transform="translate(640 548)">
    <ellipse cx="120" cy="250" rx="100" ry="11" fill="#e6dccb"/>
    <path d="M58 52 C16 86 8 150 34 196 C58 208 96 196 108 164 L116 52 Z" fill="#fbf6ef" stroke="#22301f" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M182 52 C224 86 232 150 206 196 C182 208 144 196 132 164 L124 52 Z" fill="#fbf6ef" stroke="#22301f" stroke-width="2.4" stroke-linejoin="round"/>
    <rect x="48" y="28" width="144" height="30" rx="7" fill="#fbf6ef" stroke="#22301f" stroke-width="2.4"/>
    <ellipse cx="62" cy="196" rx="28" ry="11" fill="#fbf6ef" stroke="#22301f" stroke-width="2.2"/>
    <ellipse cx="178" cy="196" rx="28" ry="11" fill="#fbf6ef" stroke="#22301f" stroke-width="2.2"/>
    <path d="M120 20 C100 2 92 22 120 26 C148 22 140 2 120 20Z" fill="#a05c2c"/>
    <text x="120" y="300" text-anchor="middle" font-family="Georgia, 'Liberation Serif', 'Times New Roman', serif" font-size="26" fill="#4c5a48">Bloomers</text>
