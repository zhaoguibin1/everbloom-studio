    <ellipse cx="46" cy="108" rx="34" ry="20" transform="rotate(-18 46 108)" fill="#fffdf8" stroke="#22301f" stroke-width="2.4"/>
    <ellipse cx="194" cy="108" rx="34" ry="20" transform="rotate(18 194 108)" fill="#fffdf8" stroke="#22301f" stroke-width="2.4"/>
    <path d="M58 86 C58 48 86 32 120 32 C154 32 182 48 182 86 L196 248 H44 Z" fill="#fffdf8" stroke="#22301f" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M74 92 Q48 118 86 132 Q120 146 154 132 Q192 118 166 92 Q120 112 74 92Z" fill="#f4eadf" stroke="#22301f" stroke-width="2"/>
